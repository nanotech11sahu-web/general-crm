services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try{rs.status().ok}catch(e){rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok}\""]
      interval: 5s
      retries: 20
    volumes: [mongo-data:/data/db]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment: { MEILI_MASTER_KEY: change-me }
    ports: ["7700:7700"]
    volumes: [meili-data:/meili_data]
volumes: { mongo-data: {}, minio-data: {}, meili-data: {} }
