# Single-host production-style stack (small installs / staging). For real production prefer managed MongoDB (Atlas, PITR) and Redis.
# Secrets come from an env file that is NOT in the repo:  docker compose -f deploy/docker-compose.prod.yml --env-file /etc/leaddesk.env up -d
# Put a TLS-terminating reverse proxy in front: /hooks/* -> ingress:3100, everything else -> web:3000 (web proxies /v1 to the api).
x-app: &app
  image: ${LEADDESK_IMAGE:-leaddesk:latest}
  env_file: ${ENV_FILE:-/etc/leaddesk.env}
  restart: unless-stopped
  depends_on: { mongo: { condition: service_healthy }, redis: { condition: service_started } }
  environment: { NODE_ENV: production, TRUST_PROXY: "1" }
services:
  migrate: { <<: *app, restart: "no", environment: { ROLE: migrate, NODE_ENV: production } }
  api: { <<: *app, environment: { ROLE: api, NODE_ENV: production, TRUST_PROXY: "1" }, expose: ["3000"], depends_on: { migrate: { condition: service_completed_successfully } } }
  worker: { <<: *app, environment: { ROLE: worker, NODE_ENV: production }, expose: ["9464"], depends_on: { migrate: { condition: service_completed_successfully } } }
  ingress: { <<: *app, environment: { ROLE: ingress, NODE_ENV: production, TRUST_PROXY: "1", PORT: "3100" }, expose: ["3100"], depends_on: { migrate: { condition: service_completed_successfully } } }
  web: { image: "${LEADDESK_WEB_IMAGE:-leaddesk-web:latest}", restart: unless-stopped, expose: ["3000"], depends_on: [api] }
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip", "localhost,mongo"]
    healthcheck: { test: ["CMD-SHELL", "mongosh --quiet --eval \"try{rs.status().ok}catch(e){rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok}\""], interval: 5s, retries: 20 }
    volumes: [mongo-data:/data/db]
    restart: unless-stopped
  redis: { image: "redis:7", command: ["redis-server", "--appendonly", "yes"], volumes: ["redis-data:/data"], restart: unless-stopped }
volumes: { mongo-data: {}, redis-data: {} }
