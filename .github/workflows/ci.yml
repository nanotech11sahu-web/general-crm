name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Dependency audit (production deps, fail on high)
        run: pnpm audit --prod --audit-level=high
      - run: pnpm typecheck
      # Integration tests start a real MongoDB replica set (mongodb-memory-server); no mocks.
      - run: pnpm test
      - name: Build web
        run: pnpm --filter @leaddesk/web build
        env: { API_URL: 'http://127.0.0.1:3300' }
      - name: Browser tests (real API + Chromium)
        run: |
          npx --prefix apps/web playwright install --with-deps chromium
          pnpm --filter @leaddesk/web e2e
      - name: Build the container images (not run in the authoring sandbox)
        run: |
          docker build -t leaddesk:ci .
          docker build -f apps/web/Dockerfile --build-arg API_URL=http://api:3000 -t leaddesk-web:ci .
      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with: { extra_args: --only-verified }
